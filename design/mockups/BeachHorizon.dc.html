<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  </style>
</helmet>
<div style="width:390px; height:380px; position:relative; overflow:hidden; background: linear-gradient(180deg, #AEDBFF 0%, #C9E6FF 42%, #E4F3FF 100%);">

  <svg width="390" height="380" viewBox="0 0 390 380" style="position:absolute; inset:0;">
    <defs>
      <radialGradient id="sun" cx="50%" cy="50%" r="50%">
        <stop offset="0%" stop-color="#FFF7E0"></stop>
        <stop offset="55%" stop-color="#FCE2A0"></stop>
        <stop offset="100%" stop-color="#F4C368" stop-opacity="0"></stop>
      </radialGradient>
      <linearGradient id="sea" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0%" stop-color="#9FCBE8"></stop>
        <stop offset="45%" stop-color="#6FA9D6"></stop>
        <stop offset="100%" stop-color="#3E7FB8"></stop>
      </linearGradient>
      <linearGradient id="palmLeaf" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#2F6B4A"></stop>
        <stop offset="100%" stop-color="#5AA378"></stop>
      </linearGradient>
      <linearGradient id="trunk" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#7A5A3C"></stop>
        <stop offset="100%" stop-color="#A9835C"></stop>
      </linearGradient>
    </defs>

    <circle cx="300" cy="78" r="70" fill="url(#sun)"></circle>
    <circle cx="300" cy="78" r="26" fill="#FEF4D8"></circle>

    <svg class="ts-drift-a" style="overflow:visible;" x="-30" y="10">
      <ellipse cx="30" cy="38" rx="26" ry="18" fill="#fff" opacity="0.8"></ellipse>
      <ellipse cx="58" cy="30" rx="30" ry="22" fill="#fff" opacity="0.8"></ellipse>
      <ellipse cx="88" cy="40" rx="22" ry="16" fill="#fff" opacity="0.8"></ellipse>
    </svg>

    <path d="M-10,190 C60,155 130,215 200,182 C260,155 320,200 400,175 L400,380 L-10,380 Z" fill="url(#sea)"></path>
    <path d="M-10,190 C60,155 130,215 200,182 C260,155 320,200 400,175" fill="none" stroke="#EAF6FF" stroke-width="2" opacity="0.55"></path>

    <path d="M340,205 l0,-16 l14,4 Z" fill="#2B5578" opacity="0.55"></path>
    <path d="M338,209 h20" stroke="#2B5578" stroke-width="1.4" opacity="0.55"></path>

    <g transform="translate(56,235)">
      <path d="M0,110 C-3,80 4,55 2,20" fill="none" stroke="url(#trunk)" stroke-width="7" stroke-linecap="round"></path>
      <g transform="translate(2,20)">
        <path d="M0,0 C-20,-8 -42,-4 -58,10 C-38,8 -18,6 0,4 Z" fill="url(#palmLeaf)" transform="rotate(-18)"></path>
        <path d="M0,0 C-18,-20 -34,-36 -46,-56 C-30,-44 -12,-28 0,-6 Z" fill="url(#palmLeaf)" transform="rotate(-6)"></path>
        <path d="M0,0 C-4,-26 -2,-50 6,-72 C10,-50 8,-26 4,-4 Z" fill="url(#palmLeaf)"></path>
        <path d="M0,0 C16,-22 30,-40 40,-62 C26,-48 10,-30 0,-6 Z" fill="url(#palmLeaf)" transform="rotate(8)"></path>
        <path d="M0,0 C22,-6 44,0 60,14 C40,10 20,6 0,4 Z" fill="url(#palmLeaf)" transform="rotate(20)"></path>
      </g>
    </g>

    <text x="195" y="360" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.3" fill="#2B5578" font-family="Inter, sans-serif">A · Beach &amp; Horizon</text>
  </svg>
</div>
</x-dc>
</body>
</html>
