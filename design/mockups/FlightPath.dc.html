<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; font-family: 'Inter', system-ui, -apple-system, sans-serif; }
  </style>
</helmet>
<div style="width:390px; height:380px; position:relative; overflow:hidden; background: linear-gradient(180deg, #AEDBFF 0%, #C9E6FF 42%, #E4F3FF 100%);">

  <svg width="390" height="380" viewBox="0 0 390 380" style="position:absolute; inset:0;">
    <defs>
      <linearGradient id="plane" x1="0" y1="0" x2="1" y2="1">
        <stop offset="0%" stop-color="#1B1F2B"></stop>
        <stop offset="100%" stop-color="#3A4258"></stop>
      </linearGradient>
      <linearGradient id="trail" x1="0" y1="0" x2="1" y2="0">
        <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0"></stop>
        <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0.95"></stop>
      </linearGradient>
    </defs>

    <svg class="ts-drift-a" style="overflow:visible;" x="-30" y="46">
      <ellipse cx="30" cy="38" rx="26" ry="18" fill="#fff" opacity="0.75"></ellipse>
      <ellipse cx="58" cy="30" rx="30" ry="22" fill="#fff" opacity="0.75"></ellipse>
      <ellipse cx="88" cy="40" rx="22" ry="16" fill="#fff" opacity="0.75"></ellipse>
    </svg>
    <svg class="ts-drift-b" style="overflow:visible;" x="230" y="210">
      <ellipse cx="30" cy="38" rx="20" ry="15" fill="#fff" opacity="0.6"></ellipse>
      <ellipse cx="56" cy="30" rx="24" ry="18" fill="#fff" opacity="0.6"></ellipse>
    </svg>

    <path d="M60,250 C110,190 150,230 190,170 C220,124 260,140 305,72" fill="none" stroke="url(#trail)" stroke-width="2.5" stroke-dasharray="1 9" stroke-linecap="round"></path>

    <g transform="translate(305,72) rotate(-52)">
      <path d="M0,-3.2 C3.4,-3.2 14,-0.9 20,0 C14,0.9 3.4,3.2 0,3.2 C-2.4,3.2 -3.4,2 -3.6,0.6 L-15,3 L-18,1.4 L-9,-0.2 L-18,-1.8 L-15,-3 L-3.6,-0.6 C-3.4,-2 -2.4,-3.2 0,-3.2 Z" fill="url(#plane)" transform="scale(1.5)"></path>
    </g>

    <circle cx="60" cy="250" r="3" fill="#F5A623"></circle>

    <text x="195" y="360" text-anchor="middle" font-size="12" font-weight="700" letter-spacing="0.3" fill="#2B5578" font-family="Inter, sans-serif">C · Flight Path</text>
  </svg>
</div>
</x-dc>
</body>
</html>
